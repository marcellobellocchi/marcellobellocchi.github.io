name: Static compilation and deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      notes_only:
        description: "Only rebuild /notes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ==================================================
      # FULL WEBSITE SOURCE
      # ==================================================

      - name: Checkout website
        if: ${{ inputs.notes_only != true }}
        uses: actions/checkout@v6


      # ==================================================
      # FULL WEBSITE BUILD
      # ==================================================

      - name: Setup PHP
        if: ${{ inputs.notes_only != true }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: Install Composer dependencies
        if: ${{ inputs.notes_only != true }}
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node
        if: ${{ inputs.notes_only != true }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        if: ${{ inputs.notes_only != true }}
        run: npm ci

      - name: Build assets
        if: ${{ inputs.notes_only != true }}
        run: npm run build

      - name: Create CI environment
        if: ${{ inputs.notes_only != true }}
        run: |
          cat > .env << 'EOF'
          APP_NAME="GitHub Pages build"
          APP_ENV=production
          APP_KEY=
          APP_DEBUG=false
          APP_URL=https://marcellobellocchi.github.io

          DB_CONNECTION=sqlite
          DB_DATABASE=:memory:

          CACHE_STORE=array
          SESSION_DRIVER=array
          QUEUE_CONNECTION=sync
          EOF

          php artisan key:generate --force

      - name: Export Laravel site
        if: ${{ inputs.notes_only != true }}
        run: php artisan export


      # ==================================================
      # NOTES
      # ==================================================

      - name: Checkout notes repository
        uses: actions/checkout@v6
        with:
          repository: marcellobellocchi/notes
          path: notes-source


      # ==================================================
      # QUARTZ
      # ==================================================

      - name: Checkout Quartz
        uses: actions/checkout@v6
        with:
          repository: jackyzha0/quartz
          ref: v5
          path: quartz-build

      - name: Checkout website configuration
        if: ${{ inputs.notes_only == true }}
        uses: actions/checkout@v6
        with:
          path: website-source
          sparse-checkout: |
            quartz
          sparse-checkout-cone-mode: true

      - name: Configure Quartz
        run: |
          if [ "${{ inputs.notes_only }}" = "true" ]; then
            cp website-source/quartz/quartz.config.default.yaml \
              quartz-build/quartz.config.default.yaml
          else
            cp quartz/quartz.config.default.yaml \
              quartz-build/quartz.config.default.yaml
          fi

          rm -rf quartz-build/content
          mkdir -p quartz-build/content

          if [ "${{ inputs.notes_only }}" = "true" ]; then
            cp -r notes-source/content/. quartz-build/content/
          else
            cp -r notes-source/. quartz-build/content/
          fi

      - name: Install Quartz dependencies
        working-directory: quartz-build
        run: npm ci

      - name: Build Quartz
        working-directory: quartz-build
        run: npx quartz build


      # ==================================================
      # CHECKOUT CURRENT PAGES STATE
      # ==================================================

      - name: Checkout pages branch
        uses: actions/checkout@v6
        with:
          ref: pages
          path: pages-repo
          fetch-depth: 0
          persist-credentials: false


      # ==================================================
      # CONFIGURE SSH FOR DEPLOY KEY
      # ==================================================

      - name: Load pages deploy key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PAGES_DEPLOY_KEY }}


      # ==================================================
      # CONFIGURE PAGES REMOTE
      # ==================================================

      - name: Configure pages remote
        working-directory: pages-repo
        run: |
          git remote set-url origin \
            "git@github.com:${{ github.repository }}.git"

          git remote -v


      # ==================================================
      # UPDATE PAGES CONTENT
      # ==================================================

      - name: Update pages content
        run: |

          if [ "${{ inputs.notes_only }}" = "true" ]; then

            # --------------------------------------------
            # NOTES ONLY
            # --------------------------------------------

            rm -rf pages-repo/notes
            mkdir -p pages-repo/notes

            cp -r quartz-build/public/. pages-repo/notes/

          else

            # --------------------------------------------
            # FULL DEPLOYMENT
            # --------------------------------------------

            # Replace the generated Laravel site.
            # Keep .git so that we preserve pages history.

            rsync -a \
              --delete \
              --exclude='.git/' \
              dist/ \
              pages-repo/

            # Replace notes with the freshly built version.

            rm -rf pages-repo/notes
            mkdir -p pages-repo/notes

            cp -r quartz-build/public/. pages-repo/notes/

          fi


      # ==================================================
      # COMMIT AND PUSH
      # ==================================================

      - name: Commit and push pages
        working-directory: pages-repo
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          if [ "${{ inputs.notes_only }}" = "true" ]; then
            git commit -m "Deploy notes"
          else
            git commit -m "Deploy site"
          fi

          git push origin HEAD:pages


      # ==================================================
      # GITHUB PAGES
      # ==================================================

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./pages-repo
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
